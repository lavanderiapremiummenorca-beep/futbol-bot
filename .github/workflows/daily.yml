name: Publicar Short diario
on:
  schedule:
    - cron: "19 17 * * *"     # ~19:19 Espana (UTC). Cambia hora/minuto si quieres, pero evita el minuto :00.
  workflow_dispatch:          # boton para lanzarlo a mano cuando quieras
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Generar el video del dia
        env:
          TTS_ENGINE: eleven
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE_ID: "PEGA_AQUI_EL_VOICE_ID"
          ELEVEN_MODEL: eleven_flash_v2_5
          FAL_KEY: ${{ secrets.FAL_KEY }}
          AI_CLIPS: "2"
          EDGE_VOICE: es-ES-AlvaroNeural
          EDGE_RATE: "+6%"
          CHANNEL_HANDLE: ${{ secrets.CHANNEL_HANDLE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python generate.py
      - name: Subir a YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: public
          YT_CATEGORY: "17"
        run: python upload.py
      - name: Guardar el video como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: video-del-dia
          path: output/*.mp4
          retention-days: 7
